<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#0A192F" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2C59" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Shield Frame -->
  <path d="M 250,40 L 410,100 C 410,280 340,390 250,450 C 160,390 90,280 90,100 Z" fill="url(#navyGrad)" filter="url(#shadow)" />
  <path d="M 250,56 L 396,112 C 396,274 330,375 250,432 C 170,375 104,274 104,112 Z" fill="none" stroke="#2563EB" stroke-width="4" opacity="0.6" />

  <!-- Roll Graphic & Leaves -->
  <g transform="translate(145, 120)">
    <!-- Roll Core Ellipse -->
    <ellipse cx="60" cy="110" rx="35" ry="60" fill="url(#redGrad)" />
    <ellipse cx="60" cy="110" rx="20" ry="38" fill="#FFFFFF" />
    <ellipse cx="60" cy="110" rx="12" ry="24" fill="#0A192F" />

    <!-- Unrolling Plastic Layer -->
    <path d="M 60,50 C 140,50 180,80 190,110 C 200,140 160,170 60,170 Z" fill="url(#blueGrad)" opacity="0.9" />
    
    <!-- Agricultural Sprout Symbol inside roll -->
    <path d="M 120,130 C 120,90 150,70 180,75 C 170,95 150,115 120,130 Z" fill="#22C55E" />
    <path d="M 125,120 C 100,100 95,75 110,60 C 125,75 125,100 125,120 Z" fill="#16A34A" />
  </g>

  <!-- Brand Accents -->
  <circle cx="250" cy="85" r="8" fill="#EF4444" />
</svg>
